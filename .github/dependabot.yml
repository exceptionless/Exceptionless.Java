version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns: ["org.junit*", "org.assertj*", "org.testcontainers*", "org.eclipse.jetty*"]
      maven-plugins:
        patterns: ["org.apache.maven.plugins*", "org.codehaus.mojo*", "org.jacoco*", "org.sonatype.central*", "com.diffplug.spotless*"]
    # Integration targets (logback, log4j, servlet, Spring Boot) stay at the oldest supported
    # version on purpose; consumers bring their own.
    ignore:
      - dependency-name: "ch.qos.logback:*"
      - dependency-name: "org.apache.logging.log4j:*"
      - dependency-name: "jakarta.servlet:*"
      - dependency-name: "org.springframework.boot:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
